<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate barcodes in multiple formats including CODE128, EAN, UPC, and more. Free, fast, and easy to use.">
    <meta name="keywords" content="barcode, generator, CODE128, EAN, UPC, CODE39, ITF14, pharmacode">

    <title>Barcode Generator - Create Barcodes Instantly</title>

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

    <style>
        :root {
            /* Color System */
            --color-primary: #6366f1;
            --color-primary-dark: #4f46e5;
            --color-primary-light: #818cf8;
            --color-success: #10b981;
            --color-error: #ef4444;
            --color-bg: #ffffff;
            --color-surface: #f9fafb;
            --color-surface-hover: #f3f4f6;
            --color-border: #e5e7eb;
            --color-text: #111827;
            --color-text-secondary: #6b7280;
            --color-text-muted: #9ca3af;

            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);

            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;

            /* Spacing */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;

            /* Border Radius */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;

            /* Transitions */
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #0f172a;
                --color-surface: #1e293b;
                --color-surface-hover: #334155;
                --color-border: #334155;
                --color-text: #f1f5f9;
                --color-text-secondary: #cbd5e1;
                --color-text-muted: #94a3b8;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            padding: var(--spacing-xl);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-sm);
        }

        .subtitle {
            color: var(--color-text-secondary);
            font-size: 1rem;
        }

        .subtitle a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .subtitle a:hover {
            text-decoration: underline;
        }

        .card {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
            margin-bottom: var(--spacing-xl);
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: var(--spacing-sm);
            color: var(--color-text);
        }

        .input-group {
            display: flex;
            gap: var(--spacing-md);
            align-items: stretch;
        }

        .input-group > * {
            flex: 1;
        }

        .input-group select {
            flex: 0 0 auto;
            min-width: 150px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: var(--spacing-md);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            background: var(--color-bg);
            color: var(--color-text);
            transition: all var(--transition-base);
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgb(99 102 241 / 0.1);
        }

        .range-group {
            display: grid;
            grid-template-columns: 120px 1fr 60px;
            gap: var(--spacing-md);
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .range-label {
            font-weight: 500;
            color: var(--color-text-secondary);
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(
                to right,
                var(--color-primary) 0%,
                var(--color-primary) var(--range-value, 50%),
                var(--color-border) var(--range-value, 50%),
                var(--color-border) 100%
            );
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: var(--shadow-md);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            border: none;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: var(--shadow-md);
        }

        .range-value {
            text-align: right;
            font-weight: 600;
            color: var(--color-primary);
            font-family: monospace;
        }

        .radio-group {
            display: flex;
            gap: var(--spacing-lg);
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            cursor: pointer;
            font-weight: 400;
        }

        input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--color-primary);
        }

        .barcode-container {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            text-align: center;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #barcode {
            max-width: 100%;
            height: auto;
        }

        #invalid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--color-error);
            color: white;
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--radius-md);
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--color-text-secondary);
            text-decoration: none;
            margin-bottom: var(--spacing-lg);
            transition: color var(--transition-base);
        }

        .back-link:hover {
            color: var(--color-primary);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .input-group {
                flex-direction: column;
            }

            .range-group {
                grid-template-columns: 100px 1fr 50px;
                gap: var(--spacing-sm);
            }

            .card {
                padding: var(--spacing-lg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">
            <span>←</span>
            <span>Back to Home</span>
        </a>

        <header>
            <h1>Barcode Generator</h1>
            <p class="subtitle">
                Powered by <a href="https://github.com/duyetdev/JsBarcode" target="_blank" rel="noopener">JsBarcode</a>
            </p>
        </header>

        <main>
            <div class="card">
                <div class="form-group">
                    <label for="userInput">Barcode Value</label>
                    <div class="input-group">
                        <input
                            type="text"
                            id="userInput"
                            value="JsBarcode"
                            placeholder="Enter barcode value"
                            autofocus
                            aria-label="Barcode value input"
                        >
                        <select id="barcodeType" aria-label="Barcode format">
                            <option value="CODE128">CODE128</option>
                            <option value="EAN">EAN</option>
                            <option value="UPC">UPC</option>
                            <option value="CODE39">CODE39</option>
                            <option value="ITF14">ITF14</option>
                            <option value="ITF">ITF</option>
                            <option value="pharmacode">Pharmacode</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <div class="range-group">
                        <span class="range-label">Bar Width</span>
                        <input type="range" id="bar-width" min="1" max="5" step="1" value="2" aria-label="Bar width control">
                        <span class="range-value" id="bar-width-display">2</span>
                    </div>

                    <div class="range-group">
                        <span class="range-label">Height</span>
                        <input type="range" id="bar-height" min="10" max="200" step="5" value="100" aria-label="Bar height control">
                        <span class="range-value" id="bar-height-display">100</span>
                    </div>

                    <div class="range-group">
                        <span class="range-label">Font Size</span>
                        <input type="range" id="bar-fontSize" min="8" max="36" step="1" value="16" aria-label="Font size control">
                        <span class="range-value" id="bar-fontSize-display">16</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="display-value" value="true" checked>
                            <span>Show Text</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="display-value" value="false">
                            <span>Hide Text</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="card barcode-container">
                <div id="invalid" role="alert">Not valid data for this barcode type!</div>
                <img id="barcode" alt="Generated barcode">
            </div>
        </main>
    </div>

    <script src="javascripts/JsBarcode.all.min.js"></script>
    <script src="javascripts/script.modern.js"></script>
</body>
</html>
